name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_HOME: ${{ github.workspace }}
      CONFIGURATION: Release
      TARGET_FRAMEWORK: net8.0-android34.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $licenses = @('y','y','y','y','y','y','y','y','y','y')
          $licenses | sdkmanager --licenses | Out-Null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Resolve SDK paths for CI
        shell: pwsh
        run: |
          $androidSdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } elseif ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $null }
          if (-not $androidSdk) {
            throw "ANDROID_SDK_ROOT or ANDROID_HOME is not set."
          }
          if (-not $env:JAVA_HOME) {
            throw "JAVA_HOME is not set."
          }
          "CI_ANDROID_SDK_DIR=$androidSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_JAVA_SDK_DIR=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install .NET Android workload
        shell: pwsh
        run: dotnet workload install android --skip-manifest-update

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $args = @(
            'restore'
            'WsjtxWatcher.csproj'
            "-p:AndroidSdkDirectory=$env:CI_ANDROID_SDK_DIR"
            "-p:JavaSdkDirectory=$env:CI_JAVA_SDK_DIR"
          )
          dotnet @args

      - name: Build Android package for non-tag refs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $args = @(
            'build'
            'WsjtxWatcher.csproj'
            '-c'
            $env:CONFIGURATION
            '-f'
            $env:TARGET_FRAMEWORK
            '--no-restore'
            "-p:AndroidSdkDirectory=$env:CI_ANDROID_SDK_DIR"
            "-p:JavaSdkDirectory=$env:CI_JAVA_SDK_DIR"
          )
          dotnet @args

      - name: Validate signing secrets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @{
            'ANDROID_KEYSTORE_BASE64' = $env:ANDROID_KEYSTORE_BASE64
            'ANDROID_KEYSTORE_PASSWORD' = $env:ANDROID_KEYSTORE_PASSWORD
            'ANDROID_KEY_ALIAS' = $env:ANDROID_KEY_ALIAS
            'ANDROID_KEY_PASSWORD' = $env:ANDROID_KEY_PASSWORD
          }
          $missing = $required.GetEnumerator() |
            Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } |
            ForEach-Object { $_.Key }
          if ($missing) {
            throw "Missing required GitHub Secrets: $($missing -join ', ')"
          }

      - name: Restore signing keystore
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $keystoreDir = Join-Path $env:GITHUB_WORKSPACE 'signing'
          $keystorePath = Join-Path $keystoreDir 'release.keystore'
          New-Item -ItemType Directory -Force -Path $keystoreDir | Out-Null
          [System.IO.File]::WriteAllBytes($keystorePath, [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "CI_ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Derive release version metadata
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $rawTag = $env:GITHUB_REF_NAME
          $assetVersion = if ($rawTag.StartsWith('v')) { $rawTag } else { "v$rawTag" }
          $displayVersion = if ($rawTag.StartsWith('v')) { $rawTag.Substring(1) } else { $rawTag }
          $versionCode = $env:GITHUB_RUN_NUMBER

          "CI_RELEASE_ASSET_VERSION=$assetVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_RELEASE_DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_RELEASE_VERSION_CODE=$versionCode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish signed Android package
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $args = @(
            'publish'
            'WsjtxWatcher.csproj'
            '-c'
            $env:CONFIGURATION
            '-f'
            $env:TARGET_FRAMEWORK
            '--no-restore'
            "-p:AndroidSdkDirectory=$env:CI_ANDROID_SDK_DIR"
            "-p:JavaSdkDirectory=$env:CI_JAVA_SDK_DIR"
            '-p:AndroidKeyStore=true'
            "-p:AndroidSigningKeyStore=$env:CI_ANDROID_KEYSTORE_PATH"
            "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD"
            "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS"
            "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD"
            "-p:ApplicationDisplayVersion=$env:CI_RELEASE_DISPLAY_VERSION"
            "-p:ApplicationVersion=$env:CI_RELEASE_VERSION_CODE"
            "-p:AndroidPackageFormats=aab;apk"
          )
          dotnet @args

      - name: Rename release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net8.0-android34.0\publish'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $version = $env:CI_RELEASE_ASSET_VERSION
          $apkSource = Get-ChildItem -Path $publishDir -Filter '*-Signed.apk' | Select-Object -First 1
          $aabSource = Get-ChildItem -Path $publishDir -Filter '*-Signed.aab' | Select-Object -First 1

          if (-not $apkSource) {
            throw "Signed APK not found in $publishDir"
          }

          if (-not $aabSource) {
            throw "Signed AAB not found in $publishDir"
          }

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -LiteralPath $apkSource.FullName -Destination (Join-Path $releaseDir "WsjtxWatcher-$version.apk")
          Copy-Item -LiteralPath $aabSource.FullName -Destination (Join-Path $releaseDir "WsjtxWatcher-$version.aab")

      - name: Upload signed APK and AAB
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: wsjtxwatcher-release-${{ env.CI_RELEASE_ASSET_VERSION }}
          path: |
            release-assets/WsjtxWatcher-${{ env.CI_RELEASE_ASSET_VERSION }}.apk
            release-assets/WsjtxWatcher-${{ env.CI_RELEASE_ASSET_VERSION }}.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.CI_RELEASE_ASSET_VERSION }}
          generate_release_notes: true
          files: |
            release-assets/WsjtxWatcher-${{ env.CI_RELEASE_ASSET_VERSION }}.apk
            release-assets/WsjtxWatcher-${{ env.CI_RELEASE_ASSET_VERSION }}.aab
